<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dedos y LEDs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="barra">
      <h1>Dedos y LEDs</h1>
      <div class="controles">
        <button type="button" id="btn-camara" class="primario">Iniciar cámara</button>
        <button type="button" id="btn-arduino">Conectar Arduino</button>
      </div>
      <p id="estado" class="estado" role="status" aria-live="polite">Modo simulado (sin Arduino conectado)</p>
    </header>

    <div class="escenario">
      <video id="video" playsinline muted></video>
      <div id="marcador-camara" class="marcador-camara">
        Cámara apagada. Presioná «Iniciar cámara» para empezar.
      </div>
      <div class="conteo-insignia" aria-label="Dedos detectados">
        <span id="conteo-numero" class="conteo-numero">—</span>
        <span class="conteo-etiqueta">dedos</span>
      </div>
      <div id="fila-leds" class="fila-leds" role="group" aria-label="Cinco LEDs virtuales">
        <svg class="led" viewBox="0 0 64 92" role="img" data-active="false" style="--led-color: #2563eb" aria-label="LED 1 azul apagado">
          <line class="led-pata" x1="25" y1="51" x2="25" y2="88" />
          <line class="led-pata" x1="39" y1="51" x2="39" y2="88" />
          <path class="led-cuerpo" d="M16 44 V26 A16 16 0 0 1 48 26 V44 Z" />
          <rect class="led-cuerpo" x="12" y="44" width="40" height="7" rx="2" />
          <path class="led-brillo" d="M22 39 V26 A10 10 0 0 1 32 16" />
        </svg>
        <svg class="led" viewBox="0 0 64 92" role="img" data-active="false" style="--led-color: #f8fafc" aria-label="LED 2 blanco apagado">
          <line class="led-pata" x1="25" y1="51" x2="25" y2="88" />
          <line class="led-pata" x1="39" y1="51" x2="39" y2="88" />
          <path class="led-cuerpo" d="M16 44 V26 A16 16 0 0 1 48 26 V44 Z" />
          <rect class="led-cuerpo" x="12" y="44" width="40" height="7" rx="2" />
          <path class="led-brillo" d="M22 39 V26 A10 10 0 0 1 32 16" />
        </svg>
        <svg class="led" viewBox="0 0 64 92" role="img" data-active="false" style="--led-color: #ef4444" aria-label="LED 3 rojo apagado">
          <line class="led-pata" x1="25" y1="51" x2="25" y2="88" />
          <line class="led-pata" x1="39" y1="51" x2="39" y2="88" />
          <path class="led-cuerpo" d="M16 44 V26 A16 16 0 0 1 48 26 V44 Z" />
          <rect class="led-cuerpo" x="12" y="44" width="40" height="7" rx="2" />
          <path class="led-brillo" d="M22 39 V26 A10 10 0 0 1 32 16" />
        </svg>
        <svg class="led" viewBox="0 0 64 92" role="img" data-active="false" style="--led-color: #f8fafc" aria-label="LED 4 blanco apagado">
          <line class="led-pata" x1="25" y1="51" x2="25" y2="88" />
          <line class="led-pata" x1="39" y1="51" x2="39" y2="88" />
          <path class="led-cuerpo" d="M16 44 V26 A16 16 0 0 1 48 26 V44 Z" />
          <rect class="led-cuerpo" x="12" y="44" width="40" height="7" rx="2" />
          <path class="led-brillo" d="M22 39 V26 A10 10 0 0 1 32 16" />
        </svg>
        <svg class="led" viewBox="0 0 64 92" role="img" data-active="false" style="--led-color: #2563eb" aria-label="LED 5 azul apagado">
          <line class="led-pata" x1="25" y1="51" x2="25" y2="88" />
          <line class="led-pata" x1="39" y1="51" x2="39" y2="88" />
          <path class="led-cuerpo" d="M16 44 V26 A16 16 0 0 1 48 26 V44 Z" />
          <rect class="led-cuerpo" x="12" y="44" width="40" height="7" rx="2" />
          <path class="led-brillo" d="M22 39 V26 A10 10 0 0 1 32 16" />
        </svg>
      </div>
    </div>
  </main>
  <script type="module" src="app.js"></script>

</body>
</html>
